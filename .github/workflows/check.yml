name: check

# Lint, typecheck, build and test on every push and pull request.
# deploy.yml waits for this workflow to pass on main before it ships.
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # The API tests migrate this database themselves (test/globalSetup.ts);
      # the defaults in apps/api/vitest.config.ts point at it.
      - name: Create the test database
        run: psql -h localhost -U postgres -c "create database assetcore_test"
        env:
          PGPASSWORD: postgres
      - run: npm run check
